services:
  mysqldb:
    image: mysql:8.3
    container_name: mysql-empresaG
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: empresaG_db
      MYSQL_USER: developer
      MYSQL_PASSWORD: 1212
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
        - "3308:3306"
    volumes:
        - mysql_data:/var/lib/mysql
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql #  Monta o arquivo init.sql

  empresaG:
    build: .
    container_name: empresaG
    restart: unless-stopped # Reinicia o container automaticamente
    depends_on:
      - mysqldb
    ports:
      - "8082:8080" # Mapeia a porta 8080 do container para a porta 8082 do PC
    environment:
        SPRING_PROFILES_ACTIVE: prod
        SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/empresaG_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        SPRING_DATASOURCE_USERNAME: developer
        SPRING_DATASOURCE_PASSWORD: 1212

volumes:
  mysql_data:   # Volume declarado aqui





